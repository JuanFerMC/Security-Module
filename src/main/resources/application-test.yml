spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    # Las rutas de las claves RSA se inyectan por TestRsaKeyInitializer (genera un par efimero en cada ejecucion).
    private-key: file:/dev/null
    public-key: file:/dev/null
    access-expiration-ms: 900000
    refresh-expiration-days: 7
    issuer: crediticio-auth
    audiences: scoring-api,evaluation-query-api
