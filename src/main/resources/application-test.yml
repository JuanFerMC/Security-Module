spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    private-key: classpath:keys/jwt-privada-test.pem
    public-key: classpath:keys/jwt-publica-test.pem
    access-expiration-ms: 900000
    refresh-expiration-days: 7
    issuer: crediticio-auth
    audiences: scoring-api,evaluation-query-api
