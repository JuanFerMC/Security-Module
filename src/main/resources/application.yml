server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_scoring}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype
            store_data_at_delete: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # BD compartida con el Motor de Scoring (V1-V99): no fallar por migraciones aplicadas por el otro servicio.
    ignore-migration-patterns: "*:missing"

app:
  jwt:
    # RS256: par de claves RSA en archivos PEM externos (nunca se versionan). La clave publica se entrega
    # a scoring-api y evaluation-query-api para validacion local.
    private-key: ${JWT_PRIVATE_KEY_LOCATION:file:./keys/jwt-privada.pem}
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:./keys/jwt-publica.pem}
    # HU09 RNF02: access token de 15 minutos como maximo (900000 ms); refresh de 7 dias como maximo.
    access-expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    # Emisor (HU09 RF04/RF05). scoring-api y evaluation-query-api validan el mismo valor.
    issuer: ${JWT_ISSUER:crediticio-auth}
    # Audiencias: cada API que valide estos tokens debe estar listada.
    audiences: ${JWT_AUDIENCES:scoring-api,evaluation-query-api}
  bootstrap:
    # Inicializacion del primer administrador (HU08 RF09/RF10). Solo actua si no existe ningun
    # ADMINISTRADOR_RIESGO. Nunca se versionan valores reales.
    admin-email: ${INIT_ADMIN_EMAIL:}
    admin-password: ${INIT_ADMIN_PASSWORD:}
    admin-nombre: ${INIT_ADMIN_NOMBRE:Administrador}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
