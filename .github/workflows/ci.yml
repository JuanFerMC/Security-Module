name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        run: ./mvnw clean test --batch-mode --no-transfer-progress

      - name: Construir JAR
        run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: crediticio-auth
          path: target/*.jar
          retention-days: 7
